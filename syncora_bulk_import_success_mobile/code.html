<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Bulk Import Success</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed": "#ffdbcc",
                        "on-secondary-container": "#54647a",
                        "secondary-fixed-dim": "#b7c8e1",
                        "on-secondary-fixed-variant": "#38485d",
                        "on-secondary-fixed": "#0b1c30",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#a44200",
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#7a2f00",
                        "primary": "#2036bd",
                        "surface-dim": "#d2d9f4",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#000d60",
                        "error": "#ba1a1a",
                        "on-secondary": "#ffffff",
                        "surface-variant": "#dae2fd",
                        "inverse-on-surface": "#eef0ff",
                        "primary-container": "#3e52d5",
                        "outline-variant": "#c5c5d7",
                        "on-background": "#131b2e",
                        "surface-container-highest": "#dae2fd",
                        "on-error-container": "#93000a",
                        "surface-container-high": "#e2e7ff",
                        "inverse-surface": "#283044",
                        "inverse-primary": "#bbc3ff",
                        "surface-container-low": "#f2f3ff",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#ffd3bf",
                        "tertiary": "#7e3100",
                        "primary-fixed-dim": "#bbc3ff",
                        "on-primary-container": "#d7daff",
                        "outline": "#757686",
                        "secondary": "#505f76",
                        "tertiary-fixed-dim": "#ffb694",
                        "surface-tint": "#3b4fd2",
                        "secondary-container": "#d0e1fb",
                        "surface-container": "#eaedff",
                        "primary-fixed": "#dfe0ff",
                        "background": "#faf8ff",
                        "on-surface": "#131b2e",
                        "secondary-fixed": "#d3e4fe",
                        "surface": "#faf8ff",
                        "on-primary-fixed-variant": "#1d34ba",
                        "on-surface-variant": "#454654",
                        "on-tertiary-fixed": "#351000",
                        "surface-bright": "#faf8ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "density-generous": "32px",
                        "margin-page": "24px",
                        "base": "4px",
                        "density-compact": "8px",
                        "gutter-grid": "16px",
                        "padding-card": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "display": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-mono": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["18px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "body-sm": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top Navigation (Transactional, no shell nav) -->
<header class="flex items-center justify-between p-4 border-b border-outline-variant bg-surface">
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md text-primary font-bold">Syncora OS</span>
</div>
<button aria-label="Close" class="text-on-surface-variant p-2 rounded-full hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<main class="flex-1 flex flex-col p-4 max-w-md mx-auto w-full pb-8">
<!-- Stepper -->
<div class="flex items-center justify-between mb-8 mt-4 px-2 relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-0.5 bg-primary-container z-0"></div>
<div class="relative z-10 flex flex-col items-center gap-1">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[14px]" data-icon="check">check</span>
</div>
<span class="font-label-mono text-label-mono text-on-surface-variant text-[10px]">Upload</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-1">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[14px]" data-icon="check">check</span>
</div>
<span class="font-label-mono text-label-mono text-on-surface-variant text-[10px]">Map</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-1">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[14px]" data-icon="check">check</span>
</div>
<span class="font-label-mono text-label-mono text-on-surface-variant text-[10px]">Validate</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-1">
<div class="w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary ring-4 ring-primary-container">
<span class="material-symbols-outlined text-[14px]" data-icon="check">check</span>
</div>
<span class="font-label-mono text-label-mono text-primary font-bold text-[10px]">Complete</span>
</div>
</div>
<!-- Success Header -->
<div class="flex flex-col items-center text-center mt-6 mb-8">
<div class="w-20 h-20 rounded-full bg-surface-container-high flex items-center justify-center mb-4 text-primary">
<span class="material-symbols-outlined text-5xl" data-icon="task_alt">task_alt</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Import Complete!</h1>
<p class="font-body-md text-body-md text-on-surface-variant">The data sync has finished processing.</p>
</div>
<!-- Summary Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-5 mb-6 shadow-sm">
<h2 class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider mb-4">Final Summary</h2>
<div class="space-y-4">
<div class="flex justify-between items-center border-b border-outline-variant pb-3">
<span class="font-body-md text-body-md text-on-surface">Total Processed</span>
<span class="font-label-mono text-label-mono text-on-surface font-semibold">150</span>
</div>
<div class="flex justify-between items-center border-b border-outline-variant pb-3">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-[#16a34a]"></span>
<span class="font-body-md text-body-md text-on-surface">Successful</span>
</div>
<span class="font-label-mono text-label-mono text-on-surface font-semibold">142</span>
</div>
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-error"></span>
<span class="font-body-md text-body-md text-on-surface">Skipped</span>
</div>
<span class="font-label-mono text-label-mono text-error font-semibold">8</span>
</div>
</div>
</div>
<!-- Warning Banner -->
<div class="bg-error-container/30 border border-error-container rounded-lg p-4 flex gap-3 items-start mb-8">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="info">info</span>
<div>
<p class="font-body-sm text-body-sm text-on-surface">8 records were skipped due to missing critical identifiers or formatting errors during validation.</p>
</div>
</div>
<!-- Actions -->
<div class="mt-auto flex flex-col gap-3">
<button class="w-full bg-primary text-on-primary font-body-md text-body-md font-medium rounded-lg py-3 px-4 flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors">
<span>Go to People Directory</span>
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-body-md text-body-md font-medium rounded-lg py-3 px-4 flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="list_alt">list_alt</span>
<span>View Import Log</span>
</button>
<button class="w-full bg-transparent text-primary font-body-md text-body-md font-medium rounded-lg py-3 px-4 flex items-center justify-center gap-2 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="download">download</span>
<span>Download Skip Report</span>
</button>
</div>
</main>
</body></html>
