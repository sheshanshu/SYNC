<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- Versatile Error Template (Currently showing 404 state, switchable via JS or backend logic) -->
<main class="w-full max-w-2xl px-margin-page py-density-generous flex flex-col items-center text-center">
<!-- Abstract Institutional Graphic -->
<div class="mb-density-generous w-48 h-48 relative flex items-center justify-center">
<!-- Subtle geometric abstraction implying disruption but maintaining professional composure -->
<div class="absolute inset-0 bg-surface-container-highest rounded-full opacity-50"></div>
<div class="absolute w-32 h-32 border border-outline-variant rounded-lg rotate-12"></div>
<div class="absolute w-32 h-32 border border-outline-variant rounded-lg -rotate-6"></div>
<span class="material-symbols-outlined text-outline" style="font-size: 64px; font-variation-settings: 'FILL' 0;">
                gpp_bad
            </span>
</div>
<!-- Error Content (404 Configuration) -->
<div class="flex flex-col items-center max-w-lg mx-auto" id="error-content">
<h1 class="font-display text-display text-on-surface mb-density-compact" id="error-title">
                Page Not Found
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-density-generous" id="error-message">
                The resource you are looking for might have been moved or is temporarily unavailable.
            </p>
</div>
<!-- Actions -->
<div class="flex flex-col sm:flex-row items-center gap-gutter-grid mb-density-generous w-full justify-center">
<button class="w-full sm:w-auto px-6 py-3 bg-primary text-on-primary rounded font-label-mono text-label-mono hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">dashboard</span>
                Return to Dashboard
            </button>
<button class="w-full sm:w-auto px-6 py-3 bg-surface text-on-surface border border-outline-variant rounded font-label-mono text-label-mono hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">support_agent</span>
                Contact Support
            </button>
</div>
</main>
<!-- Footer with Brand and Tech ID -->
<footer class="mt-auto py-density-generous w-full flex flex-col items-center border-t border-outline-variant/30">
<div class="font-headline-md text-headline-md text-primary mb-density-compact tracking-tight">
            Syncora
        </div>
<div class="flex items-center gap-2 font-label-mono text-label-mono text-outline">
<span>Tech ID:</span>
<code class="bg-surface-container-high px-2 py-1 rounded" id="error-code">ERR_404_RSRC_MISSING</code>
</div>
</footer>
<!-- Simple script to demonstrate switching states for template purposes -->
<script>
        // Example function to switch to 500 state
        function set500State() {
            document.getElementById('error-title').textContent = 'System Error';
            document.getElementById('error-message').textContent = "We're experiencing some technical difficulties. Our team has been notified.";
            document.getElementById('error-code').textContent = 'ERR_500_INT_SRVR';
            
            // Optionally change icon
            const icon = document.querySelector('.material-symbols-outlined.text-outline');
            if(icon) icon.textContent = 'warning';
        }
        
        // Uncomment to test 500 state
        // set500State();
    </script>
