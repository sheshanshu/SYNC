<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>First-Time Setup - Syncora</title>

                      "secondary-fixed": "#d3e4fe",

                      "surface-tint": "#3b4fd2",

                      "on-primary-fixed": "#000d60",
                      "primary-container": "#3e52d5",

                      "secondary": "#505f76",

              "borderRadius": {

              "spacing": {
                      "padding-card": "16px",
                      "margin-page": "24px",
                      "density-compact": "8px",
                      "density-generous": "32px",
                      "gutter-grid": "16px",
                      "base": "4px"
              },
              "fontFamily": {
                      "body-lg": [

                      ],
                      "body-sm": [

                      "display": [

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Header suppressed as per intent rule for linear/transactional onboarding -->
<main class="flex-grow flex items-center justify-center p-margin-page">
<div class="max-w-2xl w-full bg-surface-container-lowest rounded-xl border border-outline-variant p-density-generous shadow-sm">
<!-- Stepper -->
<div class="mb-density-generous">
<div class="flex items-center justify-between mb-density-compact">
<span class="font-label-mono text-label-mono text-primary">STEP 1 OF 3</span>
<span class="font-label-mono text-label-mono text-on-surface-variant">Profile Setup</span>
</div>
<div class="w-full bg-surface-container-high rounded-full h-2">
<div class="bg-primary h-2 rounded-full" style="width: 33%"></div>
</div>
</div>
<div class="text-center mb-density-generous">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-density-compact">Personalize your Profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome to Syncora. Let's start by setting up your basic information to tailor your experience.</p>
</div>
<form class="space-y-margin-page">
<!-- Photo Upload -->
<div class="flex flex-col items-center gap-density-compact">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container overflow-hidden border border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-outline-variant">person</span>
</div>
<div class="absolute inset-0 bg-on-surface/50 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
<span class="material-symbols-outlined text-on-primary">upload</span>
</div>
</div>
<span class="font-label-mono text-label-mono text-primary cursor-pointer hover:underline">Upload Photo</span>
</div>
<!-- Name Input -->
<div class="flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface" for="preferred-name">Preferred Name</label>
<input class="w-full rounded bg-surface-container-lowest border border-outline-variant px-padding-card py-density-compact font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background outline-none transition-all" id="preferred-name" placeholder="How should we call you?" type="text"/>
</div>
<!-- Timezone Selection -->
<div class="flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface" for="timezone">Timezone</label>
<div class="relative">
<select class="w-full rounded bg-surface-container-lowest border border-outline-variant px-padding-card py-density-compact font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background outline-none transition-all appearance-none pr-10" id="timezone">
<option value="pst">Pacific Time (PT)</option>
<option value="mst">Mountain Time (MT)</option>
<option value="cst">Central Time (CT)</option>
<option value="est">Eastern Time (ET)</option>
<option value="utc">Coordinated Universal Time (UTC)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
<!-- Actions -->
<div class="flex justify-end gap-gutter-grid pt-density-compact">
<button class="px-margin-page py-density-compact rounded bg-surface-container-lowest border border-outline-variant text-on-surface font-label-mono text-label-mono hover:bg-surface-container-low transition-colors" type="button">Skip for now</button>
<button class="px-margin-page py-density-compact rounded bg-primary text-on-primary font-label-mono text-label-mono hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm" type="button">Next Step</button>
</div>
</form>
</div>
</main>
<!-- Footer suppressed as per intent rule for linear/transactional onboarding -->
</body></html>
