<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Abstract Background Pattern -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-primary-fixed-dim via-background to-background"></div>
<!-- Success Card -->
<div class="relative z-10 w-full max-w-[480px] bg-surface-container-lowest rounded-xl shadow-sm border border-surface-border p-8 md:p-12 flex flex-col items-center text-center transform transition-all duration-500 hover:shadow-md animate-fade-in-up">
<!-- Success Icon -->
<div class="w-20 h-20 rounded-full bg-success/10 flex items-center justify-center mb-6 animate-pulse">
<span class="material-symbols-outlined text-success text-[48px]" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Content -->
<h1 class="font-headline-lg md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-4">
                Password Successfully Reset
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-8 max-w-[400px]">
                Your account security has been updated. You can now log in with your new credentials.
            </p>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md py-3 px-6 rounded transition-colors duration-200 flex items-center justify-center gap-2">
<span>Back to Login</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
<!-- Decorative line -->
<div class="mt-8 w-16 h-1 bg-surface-border rounded-full"></div>
</div>
</main>
<!-- Footer - Simplified for transactional view -->
<footer class="w-full py-6 px-margin-mobile md:px-margin-desktop flex flex-col md:flex-row justify-center md:justify-between items-center bg-surface-container-lowest border-t border-surface-border gap-4 z-10">

<div class="font-label-md text-label-md text-on-surface-variant">© 2024 Syncora. High-Fidelity Operational Clarity.</div>
</footer>
<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;

            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            animation: fadeInUp 0.6s ease-out forwards;
