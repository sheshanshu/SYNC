<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('#otp-inputs input');
        
        inputs.forEach((input, index) => {
            // Focus next input on typing
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            // Handle backspace to go to previous input
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Allow pasting full 6 digit code
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/[^0-9]/g, '');
                
                if (pastedData) {
                    pastedData.split('').forEach((char, i) => {
                        if (i < inputs.length) {
                            inputs[i].value = char;
                        }
                    });
                    
                    // Focus last filled input or next empty one
                    const nextEmptyIndex = pastedData.length < 6 ? pastedData.length : 5;
                    inputs[nextEmptyIndex].focus();
                }
            });
        });

        // Simple Countdown Timer Logic
        let timeLeft = 59;
        const timerDisplay = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');
        let timerId;

        function updateTimer() {
            if (timeLeft <= 0) {
                clearInterval(timerId);
                timerDisplay.textContent = "";
                resendBtn.disabled = false;
                resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                const seconds = timeLeft.toString().padStart(2, '0');
                timerDisplay.textContent = `(00:${seconds})`;
                timeLeft--;
            }
        }

        function startTimer() {
            timeLeft = 59;
            resendBtn.disabled = true;
            resendBtn.classList.add('opacity-50', 'cursor-not-allowed');
            updateTimer();
            timerId = setInterval(updateTimer, 1000);
        }

        startTimer();

        resendBtn.addEventListener('click', () => {
            if (!resendBtn.disabled) {
                // Simulate resend action
                console.log("Resending code...");
                inputs.forEach(input => input.value = ''); // Clear inputs
                inputs[0].focus();
                startTimer();
            }
        });
        
        document.getElementById('otp-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const code = Array.from(inputs).map(input => input.value).join('');
            console.log('Submitting OTP:', code);
            // Form submission logic would go here
        });
    </script>
