<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Syncora - Create Assignment</title>

                      "on-error": "#ffffff",
                      "primary": "#2036bd",
                      "surface-bright": "#faf8ff",
                      "outline-variant": "#c5c5d7",

<style>
        body {
            background-color: #F8FAFC; /* Level 0 Canvas */
            color: #131b2e; /* on-background */
        }
        
        /* Custom Scrollbar for sleekness */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c5c5d7;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #757686;
        }

        .form-input {
            transition: all 0.2s ease;
        }
        .form-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #2036bd; /* Focus ring */
            border-color: transparent;
        }
        
        .rte-toolbar button:hover {
            background-color: #eaedff;
            border-radius: 4px;
        }
    </style>
</head>
<body class="font-body-md text-body-md min-h-screen flex flex-col md:flex-row">
<!-- Top Navigation (Desktop) - Suppressed per rule, this is a linear/transactional task focused page with a clear 'Cancel' secondary action back to main flow, prioritizing canvas -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-page h-16 bg-surface border-b border-outline-variant md:hidden">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="text-on-surface-variant p-2 -ml-2 rounded-lg hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary">Create Assignment</h1>
</div>
<button class="font-label-mono text-label-mono text-primary font-bold">SAVE DRAFT</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[1024px] mx-auto pt-20 md:pt-density-generous px-margin-page md:px-density-generous pb-32">
<div class="hidden md:flex justify-between items-center mb-density-generous">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="text-on-surface-variant p-2 -ml-2 rounded-lg hover:bg-surface-container-high transition-colors flex items-center justify-center bg-surface border border-outline-variant">
<span class="material-symbols-outlined">close</span>
</button>
<div>
<h1 class="font-headline-lg text-headline-lg font-bold text-on-background">Create Assignment</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Design a new assessment for your students.</p>
</div>
</div>
<div class="flex gap-4">
<button class="px-6 py-2 rounded font-label-mono text-label-mono bg-surface border border-outline-variant text-on-background hover:bg-surface-container transition-colors">Save Draft</button>
</div>
</div>
<form class="space-y-gutter-grid">
<!-- Section 1: Core Details -->
<section class="bg-surface border border-outline-variant rounded-xl p-padding-card md:p-margin-page">
<h2 class="font-headline-md text-headline-md font-bold mb-margin-page border-b border-outline-variant pb-2">Core Details</h2>
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter-grid">
<div class="md:col-span-12 flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="assignment-title">Assignment Title <span class="text-error">*</span></label>
<input class="form-input border border-outline-variant rounded p-3 font-body-md text-on-background bg-surface w-full" id="assignment-title" placeholder="e.g., Midterm Essay: The Industrial Revolution" type="text"/>
</div>
<div class="md:col-span-6 flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="course-selection">Course <span class="text-error">*</span></label>
<div class="relative">
<select class="form-input border border-outline-variant rounded p-3 font-body-md text-on-background bg-surface w-full appearance-none pr-10" id="course-selection">
<option disabled="" selected="" value="">Select a course...</option>
<option value="hist101">HIST 101: World History</option>
<option value="eng202">ENG 202: Modern Literature</option>
<option value="cs301">CS 301: Data Structures</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="md:col-span-6 flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="category-selection">Category <span class="text-error">*</span></label>
<div class="relative">
<select class="form-input border border-outline-variant rounded p-3 font-body-md text-on-background bg-surface w-full appearance-none pr-10" id="category-selection">
<option disabled="" selected="" value="">Select a category...</option>
<option value="homework">Homework</option>
<option value="quiz">Quiz</option>
<option value="project">Project</option>
<option value="exam">Exam</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
</section>
<!-- Section 2: Instructions -->
<section class="bg-surface border border-outline-variant rounded-xl p-padding-card md:p-margin-page">
<h2 class="font-headline-md text-headline-md font-bold mb-margin-page border-b border-outline-variant pb-2">Instructions</h2>
<div class="flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Description</label>
<!-- Fake Rich Text Editor -->
<div class="border border-outline-variant rounded overflow-hidden bg-surface flex flex-col focus-within:ring-2 focus-within:ring-primary focus-within:ring-offset-2 focus-within:border-transparent transition-all">
<!-- Toolbar -->
<div class="bg-surface-container-low border-b border-outline-variant p-2 flex flex-wrap gap-2 items-center rte-toolbar">
<button aria-label="Bold" class="p-1.5 text-on-surface-variant flex items-center justify-center" type="button"><span class="material-symbols-outlined" style="font-size: 18px;">format_bold</span></button>
<button aria-label="Italic" class="p-1.5 text-on-surface-variant flex items-center justify-center" type="button"><span class="material-symbols-outlined" style="font-size: 18px;">format_italic</span></button>
<button aria-label="Underline" class="p-1.5 text-on-surface-variant flex items-center justify-center" type="button"><span class="material-symbols-outlined" style="font-size: 18px;">format_underlined</span></button>
<div class="w-px h-5 bg-outline-variant mx-1"></div>
<button aria-label="Bullet List" class="p-1.5 text-on-surface-variant flex items-center justify-center" type="button"><span class="material-symbols-outlined" style="font-size: 18px;">format_list_bulleted</span></button>
<button aria-label="Numbered List" class="p-1.5 text-on-surface-variant flex items-center justify-center" type="button"><span class="material-symbols-outlined" style="font-size: 18px;">format_list_numbered</span></button>
<div class="w-px h-5 bg-outline-variant mx-1"></div>
<button aria-label="Link" class="p-1.5 text-on-surface-variant flex items-center justify-center" type="button"><span class="material-symbols-outlined" style="font-size: 18px;">link</span></button>
</div>
<!-- Editor Area -->
<textarea class="w-full h-48 p-4 font-body-md text-on-background resize-y border-none focus:ring-0 outline-none" placeholder="Provide clear instructions for this assignment..."></textarea>
</div>
</div>
<!-- Attachment Area -->
<div class="mt-margin-page flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Attachments</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined">upload_file</span>
</div>
<p class="font-headline-md text-headline-md text-on-background mb-1">Click to upload or drag and drop</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">PDF, DOCX, PNG up to 10MB</p>
</div>
</div>
</section>
<!-- Section 3: Scheduling & Grading -->
<section class="bg-surface border border-outline-variant rounded-xl p-padding-card md:p-margin-page">
<h2 class="font-headline-md text-headline-md font-bold mb-margin-page border-b border-outline-variant pb-2">Scheduling &amp; Grading</h2>
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter-grid items-start">
<!-- Dates -->
<div class="md:col-span-8 grid grid-cols-1 sm:grid-cols-2 gap-gutter-grid border-r-0 md:border-r md:border-outline-variant md:pr-gutter-grid">
<div class="flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="due-date">Due Date <span class="text-error">*</span></label>
<div class="relative">
<input class="form-input border border-outline-variant rounded p-3 font-body-md text-on-background bg-surface w-full pr-10" id="due-date" type="date"/>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="due-time">Due Time <span class="text-error">*</span></label>
<div class="relative">
<input class="form-input border border-outline-variant rounded p-3 font-body-md text-on-background bg-surface w-full pr-10" id="due-time" type="time" value="23:59"/>
</div>
</div>
</div>
<!-- Points -->
<div class="md:col-span-4 flex flex-col gap-base">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="total-marks">Total Marks <span class="text-error">*</span></label>
<input class="form-input border border-outline-variant rounded p-3 font-body-md text-on-background bg-surface w-full" id="total-marks" min="0" placeholder="100" type="number"/>
</div>
</div>
<!-- Settings Toggles -->
<div class="mt-density-generous pt-margin-page border-t border-outline-variant flex flex-col gap-margin-page">
<label class="flex items-center justify-between cursor-pointer group">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-background">Allow late submissions</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Students can submit after the due date (marked as late).</span>
</div>
<div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
<input checked="" class="peer absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out border-outline-variant checked:border-primary checked:translate-x-6 checked:bg-white z-10 top-0 left-0" id="late-toggle" name="toggle" type="checkbox"/>
<div class="block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer peer-checked:bg-primary transition-colors duration-200 ease-in-out w-12"></div>
</div>
</label>
<label class="flex items-center justify-between cursor-pointer group">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-background">Require Peer Review</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Automatically assign submissions for student review.</span>
</div>
<div class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in">
<input class="peer absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out border-outline-variant checked:border-primary checked:translate-x-6 checked:bg-white z-10 top-0 left-0" id="peer-toggle" name="toggle" type="checkbox"/>
<div class="block overflow-hidden h-6 rounded-full bg-outline-variant cursor-pointer peer-checked:bg-primary transition-colors duration-200 ease-in-out w-12"></div>
</div>
</label>
</div>
</section>
</form>
<!-- Floating Action Area (Mobile fixed bottom, Desktop inline) -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-4 flex justify-end gap-4 z-40 md:relative md:bg-transparent md:border-none md:p-0 md:mt-density-generous md:z-auto shadow-[0_-4px_12px_rgba(0,0,0,0.05)] md:shadow-none">
<button class="md:hidden px-6 py-3 rounded font-label-mono text-label-mono bg-surface border border-outline-variant text-on-background w-full md:w-auto">Cancel</button>
<button class="px-6 py-3 rounded bg-primary text-on-primary font-label-mono text-label-mono hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm w-full md:w-auto flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-size: 18px;">publish</span>
                 Publish Assignment
             </button>
</div>
</main>
</body></html>
