<body class="bg-background text-on-surface font-body-md h-screen w-screen overflow-hidden flex">
<!-- Background Image / Previous Screen Context -->
<div class="absolute inset-0 z-0">
<img alt="Background Screen" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC4Lapzu0sC89eUJN_d7dJCU5Hcb5-HhEsqYNgQ_vfjgw_fxPlbowcbqG6qBJNbS6jnsgRkjlnb9Tqdx1SdbcUS2kvYG0QFEjdShDJJnsmQkdUDRxbt9NrkE9f5MhZVVdAgOyA_ChEjVdFA-usseb5uXqG4lXgfu8oJTCfld7yEs8FYI_wVJbpr5iP0W5DrYWu3Ak86cDNkbvO1TlKQeOtdcqZ7sHqirmGKmpvQs-1t58C5biKeDwgg">
<!-- Dimmer Overlay -->
<div class="absolute inset-0 bg-inverse-surface/60 backdrop-blur-sm z-10 flex items-center justify-center p-4">
<!-- Modal Container (Level 2 Elevation) -->
<div class="bg-surface w-full max-w-2xl rounded-xl border border-outline-variant shadow-[0_12px_24px_-12px_rgba(0,0,0,0.15)] flex flex-col max-h-[90vh]">
<!-- Modal Header -->
<div class="px-padding-card py-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-lowest rounded-t-xl shrink-0">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">Edit Record</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Sarah Jenkins</p>
</div>
<button aria-label="Close modal" class="text-on-surface-variant hover:bg-surface-container-highest p-2 rounded transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Modal Body (Scrollable) -->
<div class="p-padding-card flex-1 overflow-y-auto">
<!-- Error Summary Banner (Status Pill styling logic) -->
<div class="bg-error-container/30 border border-error-container rounded-lg p-3 flex items-start gap-3 mb-6">
<span class="material-symbols-outlined text-error mt-0.5" data-icon="error">error</span>
<div>
<h3 class="font-body-md text-body-md font-semibold text-error">Validation Failed</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Missing Required Field: Department_ID. Please update the department to proceed with the import.</p>
</div>
</div>
<!-- Form Layout -->
<form class="space-y-5">
<!-- Row 1: Full Name & Email -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter-grid">
<div class="space-y-2">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="fullName">Full Name</label>
<input class="w-full border border-outline-variant rounded bg-surface-container-lowest px-3 py-2 font-body-md text-body-md focus:ring-2 focus:ring-primary focus:ring-offset-1 focus:border-primary transition-shadow" id="fullName" readonly="" type="text" value="Sarah Jenkins">
</div>
<div class="space-y-2">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="email">Email Address</label>
<input class="w-full border border-outline-variant rounded bg-surface-container-lowest px-3 py-2 font-body-md text-body-md focus:ring-2 focus:ring-primary focus:ring-offset-1 focus:border-primary transition-shadow" id="email" readonly="" type="email" value="s.jenkins@university.edu">
</div>
</div>
<!-- Row 2: Identifier & Role -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter-grid">
<div class="space-y-2">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="identifier">Identifier (ID)</label>
<input class="w-full border border-outline-variant rounded bg-surface-container-lowest px-3 py-2 font-label-mono text-label-mono text-on-surface-variant focus:ring-2 focus:ring-primary focus:ring-offset-1 focus:border-primary transition-shadow" id="identifier" readonly="" type="text" value="EMP-84729">
</div>
<div class="space-y-2">
<label class="block font-body-sm text-body-sm font-semibold text-on-surface" for="role">Role</label>
<input class="w-full border border-outline-variant rounded bg-surface-container-lowest px-3 py-2 font-body-md text-body-md focus:ring-2 focus:ring-primary focus:ring-offset-1 focus:border-primary transition-shadow" id="role" type="text" value="Adjunct Professor">
</div>
</div>
<!-- Row 3: Department (Error State) -->
<div class="space-y-2">
<label class="block font-body-sm text-body-sm font-semibold text-error" for="department">Department *</label>
<div class="relative">
<select class="w-full border-2 border-error rounded bg-surface-container-lowest pl-3 pr-10 py-2 font-body-md text-body-md text-on-surface appearance-none focus:ring-2 focus:ring-error focus:ring-offset-1 focus:outline-none transition-shadow" id="department">
<option disabled="" selected="" value="">Select Department</option>
<option value="cs">Computer Science</option>
<option value="math">Mathematics</option>
<option value="physics">Physics</option>
<option value="literature">Literature</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-error">
<span class="material-symbols-outlined text-[20px]" data-icon="warning">warning</span>
</div>
</div>
<p class="font-body-sm text-body-sm text-error mt-1 flex items-center gap-1">
                                Department selection is required to complete import.
                            </p>
</div>
</form>
</div>
<!-- Modal Footer -->
<div class="px-padding-card py-4 border-t border-outline-variant bg-surface-container-low rounded-b-xl flex justify-end gap-3 shrink-0">
<button class="px-4 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface font-body-sm text-body-sm font-semibold hover:bg-surface-container-high transition-colors" type="button">
                        Cancel
                    </button>
<button class="px-4 py-2 border border-transparent rounded bg-primary text-on-primary font-body-sm text-body-sm font-semibold hover:bg-primary-container transition-colors shadow-sm" type="button">
                        Save &amp; Re-validate
                    </button>
</div>
</div>
</div>
</div>
</body></html>
