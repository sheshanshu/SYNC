<!-- Simple script for drag state visualization -->
<script>
        const dropZone = document.querySelector('input[type="file"]').parentElement;
        
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        function highlight(e) {
            dropZone.classList.add('bg-surface-container', 'border-primary');
            dropZone.classList.remove('bg-surface-container-low', 'border-outline-variant');
        }

        function unhighlight(e) {
            dropZone.classList.remove('bg-surface-container', 'border-primary');
            dropZone.classList.add('bg-surface-container-low', 'border-outline-variant');
        }
    </script>
