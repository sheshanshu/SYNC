<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold">Syncora</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-page py-density-generous w-full max-w-md mx-auto">
<div class="w-full space-y-6">
<!-- Header Section -->
<div class="text-center space-y-2 mb-8">
<div class="w-16 h-16 bg-surface-container-high rounded-full flex items-center justify-center mx-auto mb-4">
<span class="material-symbols-outlined text-3xl text-primary">lock_reset</span>
</div>
<h2 class="font-display text-display text-on-background">Forgot Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                    Enter your registered institutional email address to receive a recovery code.
                </p>
</div>
<!-- Form Section -->
<form class="space-y-6 w-full" onsubmit="event.preventDefault();">
<div class="space-y-1 w-full">
<label class="font-label-mono text-label-mono text-on-surface block mb-1" for="email">Institutional Email</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="w-full pl-10 pr-3 py-3 bg-surface-container-lowest border border-outline-variant rounded-DEFAULT font-body-md text-body-md text-on-background placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background transition-shadow" id="email" name="email" placeholder="admin@institution.edu" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary py-3 px-4 rounded-DEFAULT font-headline-md text-headline-md hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Send Recovery Code
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
<!-- Footer Link -->
<div class="pt-6 text-center">
<a class="font-label-mono text-label-mono text-primary hover:text-primary-container transition-colors inline-flex items-center gap-1" href="#">

</div>
