<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Input animations */
        .input-focus-ring:focus-within {
            border-color: theme('colors.primary');
            box-shadow: 0 0 0 1px theme('colors.primary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pt-safe-top pb-safe-bottom">
<!-- Top Navigation for Checkout (Transactional, so standard shell is suppressed, custom header used) -->
<header class="flex items-center justify-between px-4 h-16 w-full bg-surface shrink-0 border-b border-surface-dim sticky top-0 z-50">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight">Checkout</h1>
<div class="w-10 h-10 flex items-center justify-center">
<span class="material-symbols-outlined text-xl text-occupancy-available" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
</header>
<!-- Main Checkout Scrollable Area -->
<main class="flex-1 overflow-y-auto hide-scrollbar pb-32">
<div class="px-4 py-6 max-w-md mx-auto space-y-6">
<!-- Order Summary Section -->
<section class="bg-surface-container-lowest rounded-xl border border-outline-variant p-5 shadow-sm">
<div class="flex items-start justify-between mb-4">
<div>
<p class="font-label-mono text-label-mono text-secondary mb-1 uppercase tracking-wider">Invoice #INV-2023-441</p>
<h2 class="font-headline-md text-headline-md text-on-surface">Fall Semester Hostel Fee</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Due: Oct 15, 2023</p>
</div>
</div>
<div class="space-y-3 mt-4 border-t border-surface-dim pt-4">
<div class="flex justify-between items-center font-body-md text-body-md">
<span class="text-on-surface-variant">Base Fee</span>
<span class="text-on-surface font-medium">$1,250.00</span>
</div>
<div class="flex justify-between items-center font-body-md text-body-md">
<span class="text-on-surface-variant">Maintenance Charge</span>
<span class="text-on-surface font-medium">$50.00</span>
</div>
<div class="flex justify-between items-center font-body-md text-body-md text-secondary">
<span class="flex items-center gap-1">
                            Convenience Fee 
                            <span class="material-symbols-outlined text-[14px]">info</span>
</span>
<span>$12.50</span>
</div>
<div class="flex justify-between items-center pt-3 border-t border-surface-dim mt-2">
<span class="font-headline-md text-headline-md text-on-surface font-semibold">Total</span>
<span class="font-headline-lg text-headline-lg text-primary font-bold tracking-tight">$1,312.50</span>
</div>
</div>
</section>
<!-- Payment Methods Section -->
<section class="space-y-4">
<h3 class="font-body-lg text-body-lg text-on-surface font-medium px-1">Payment Method</h3>
<div class="space-y-3" id="payment-methods">
<!-- Saved Card Option (Selected) -->
<label class="relative block cursor-pointer group">
<input checked="" class="peer sr-only" name="payment_method" type="radio" value="card_ending_4242"/>
<div class="bg-surface-container-lowest border-2 border-primary rounded-xl p-4 flex items-center gap-4 transition-all shadow-sm">
<div class="w-12 h-8 bg-surface-container rounded border border-outline-variant flex items-center justify-center shrink-0">
<!-- Placeholder for Visa Logo -->
<span class="font-label-mono text-[10px] text-primary font-bold italic">VISA</span>
</div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface font-medium">•••• •••• •••• 4242</p>
<p class="font-body-sm text-body-sm text-secondary">Expires 12/25</p>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center peer-checked:bg-primary">
<div class="w-2.5 h-2.5 rounded-full bg-on-primary scale-100 transition-transform"></div>
</div>
</div>
</label>
<!-- Add New Card Option -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="payment_method" type="radio" value="new_card"/>
<div class="bg-surface-container-lowest border border-outline-variant peer-checked:border-2 peer-checked:border-primary rounded-xl p-4 flex items-center gap-4 transition-all hover:bg-surface-container-low">
<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center shrink-0 text-on-surface-variant">
<span class="material-symbols-outlined text-xl">credit_card</span>
</div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface font-medium">Add New Card</p>
</div>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</div>
</label>
<!-- Net Banking Option -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="payment_method" type="radio" value="net_banking"/>
<div class="bg-surface-container-lowest border border-outline-variant peer-checked:border-2 peer-checked:border-primary rounded-xl p-4 flex items-center gap-4 transition-all hover:bg-surface-container-low">
<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center shrink-0 text-on-surface-variant">
<span class="material-symbols-outlined text-xl">account_balance</span>
</div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface font-medium">Net Banking</p>
<p class="font-body-sm text-body-sm text-secondary">All major banks supported</p>
</div>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</div>
</label>
<!-- UPI / Wallet Option -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="payment_method" type="radio" value="upi"/>
<div class="bg-surface-container-lowest border border-outline-variant peer-checked:border-2 peer-checked:border-primary rounded-xl p-4 flex items-center gap-4 transition-all hover:bg-surface-container-low">
<div class="w-10 h-10 bg-surface-container rounded-full flex items-center justify-center shrink-0 text-on-surface-variant">
<span class="material-symbols-outlined text-xl">qr_code_scanner</span>
</div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface font-medium">UPI / Digital Wallets</p>
</div>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</div>
</label>
</div>
</section>
<!-- CVV Input for Saved Card (Contextual) -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm transition-all duration-300 origin-top" id="cvv-section">
<label class="block font-body-sm text-body-sm text-on-surface-variant mb-2" for="cvv">Confirm CVV for card ending in 4242</label>
<div class="relative flex items-center border border-outline-variant rounded-lg bg-surface input-focus-ring overflow-hidden">
<span class="pl-3 text-on-surface-variant material-symbols-outlined">lock</span>
<input class="w-full bg-transparent border-none focus:ring-0 font-label-mono text-label-mono py-3 px-3 text-on-surface placeholder:text-outline-variant tracking-widest" id="cvv" maxlength="3" placeholder="•••" type="password"/>
<span class="pr-3 text-secondary font-label-mono text-[10px]">3 digits</span>
</div>
</section>
<!-- Security Badges -->
<div class="flex items-center justify-center gap-6 py-4 opacity-70">
<div class="flex items-center gap-1.5 text-secondary">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-data-viz text-data-viz uppercase tracking-widest">256-bit Secure</span>
</div>
<div class="w-px h-4 bg-outline-variant"></div>
<div class="flex items-center gap-1.5 text-secondary">
<span class="material-symbols-outlined text-[18px]">shield</span>
<span class="font-data-viz text-data-viz uppercase tracking-widest">SSL Encrypted</span>
</div>
</div>
</div>
</main>
<!-- Bottom Sticky Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-dim p-4 pb-safe shadow-[0_-4px_16px_rgba(0,0,0,0.05)] z-50">
<div class="max-w-md mx-auto flex items-center justify-between gap-4">
<div class="flex flex-col">
<span class="font-body-sm text-body-sm text-on-surface-variant">Paying</span>
<span class="font-headline-md text-headline-md text-on-surface font-bold">$1,312.50</span>
</div>
<button class="flex-1 bg-primary text-on-primary font-body-md text-body-md font-medium h-12 rounded-xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform shadow-sm hover:bg-on-primary-fixed-variant">
<span>Confirm &amp; Pay</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
        // Simple logic to show/hide CVV based on selected payment method
        const paymentRadios = document.querySelectorAll('input[name="payment_method"]');
        const cvvSection = document.getElementById('cvv-section');
        
        paymentRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if(e.target.value === 'card_ending_4242') {
                    cvvSection.style.display = 'block';
                    // Optional: animate in
                    cvvSection.style.opacity = '0';
                    setTimeout(() => cvvSection.style.opacity = '1', 10);
                } else {
                    cvvSection.style.display = 'none';
                }
            });
        });
    </script>
</body></html>
