<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Syncora - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed": "#260059",
                      "on-background": "#0b1c30",
                      "surface-container-low": "#eff4ff",
                      "warning": "#F59E0B",
                      "surface": "#f8f9ff",
                      "secondary-fixed": "#ebdcff",
                      "on-primary": "#ffffff",
                      "secondary-container": "#8a54e9",
                      "primary-container": "#091f3f",
                      "error": "#EF4444",
                      "surface-container-high": "#dce9ff",
                      "on-tertiary-fixed": "#002022",
                      "secondary-fixed-dim": "#d3bbff",
                      "error-container": "#ffdad6",
                      "secondary": "#7037ce",
                      "on-primary-fixed-variant": "#344769",
                      "info": "#3B82F6",
                      "tertiary-fixed": "#6ef6ff",
                      "surface-variant": "#d3e4fe",
                      "on-tertiary-container": "#00969d",
                      "on-error-container": "#93000a",
                      "surface-tint": "#4c5f82",
                      "on-secondary-fixed-variant": "#5a16b8",
                      "tertiary": "#00090a",
                      "on-primary-fixed": "#041b3b",
                      "surface-border": "#E2E8F0",
                      "on-error": "#ffffff",
                      "surface-bright": "#f8f9ff",
                      "on-secondary-container": "#fffbff",
                      "surface-dim": "#cbdbf5",
                      "background": "#f8f9ff",
                      "inverse-primary": "#b4c7ef",
                      "surface-container": "#e5eeff",
                      "primary-fixed-dim": "#b4c7ef",
                      "tertiary-container": "#002426",
                      "primary-fixed": "#d7e2ff",
                      "outline": "#75777f",
                      "tertiary-fixed-dim": "#4cd9e2",
                      "surface-container-lowest": "#ffffff",
                      "primary": "#000718",
                      "surface-container-highest": "#d3e4fe",
                      "inverse-surface": "#213145",
                      "on-secondary": "#ffffff",
                      "on-surface": "#0b1c30",
                      "success": "#10B981",
                      "on-primary-container": "#7587ad",
                      "on-tertiary": "#ffffff",
                      "inverse-on-surface": "#eaf1ff",
                      "on-surface-variant": "#44474e",
                      "outline-variant": "#c5c6cf",
                      "on-tertiary-fixed-variant": "#004f53"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "gutter": "24px",
                      "skeleton-gap": "12px",
                      "unit": "4px",
                      "margin-desktop": "40px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "body-md": [
                              "Inter", "sans-serif"
                      ],
                      "body-lg": [
                              "Inter", "sans-serif"
                      ],
                      "headline-sm": [
                              "Inter", "sans-serif"
                      ],
                      "headline-lg": [
                              "Inter", "sans-serif"
                      ],
                      "headline-md": [
                              "Inter", "sans-serif"
                      ],
                      "headline-lg-mobile": [
                              "Inter", "sans-serif"
                      ],
                      "code": [
                              "JetBrains Mono", "monospace"
                      ],
                      "label-md": [
                              "Inter", "sans-serif"
                      ]
              },
              "fontSize": {
                      "body-md": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-sm": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "-0.01em",
                                      "fontWeight": "600"
                              }
                      ],
                      "headline-lg-mobile": [
                              "24px",
                              {
                                      "lineHeight": "30px",
                                      "fontWeight": "700"
                              }
                      ],
                      "code": [
                              "13px",
                              {
                                      "lineHeight": "18px",
                                      "fontWeight": "400"
                              }
                      ],
                      "label-md": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "600"
                              }
                      ]
              },
              "keyframes": {
                "progress": {
                  "0%": { width: "0%" },
                  "100%": { width: "100%" }
                },
                "fade-in-up": {
                  "0%": { opacity: "0", transform: "translateY(20px)" },
                  "100%": { opacity: "1", transform: "translateY(0)" }
                }
              },
              "animation": {
                "progress": "progress 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards",
                "fade-in-up": "fade-in-up 0.8s ease-out forwards"
              }
            }
          }
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Subtle geometric background pattern */
        .bg-pattern {
            background-color: #f8f9ff;
            background-image: 
                linear-gradient(to right, rgba(226, 232, 240, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(226, 232, 240, 0.5) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col justify-center items-center bg-pattern relative">
<!-- Decorative ambient blur for depth -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-surface-container-high rounded-full blur-[100px] opacity-60 pointer-events-none"></div>
<main class="relative z-10 flex flex-col items-center max-w-[400px] w-full px-margin-mobile md:px-margin-desktop text-center animate-fade-in-up">
<!-- Logo Container -->
<div class="mb-8">
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg md:text-headline-lg font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Syncora</h1>
</div>
<!-- Tagline -->
<p class="font-body-md text-body-md text-on-surface-variant mb-12 max-w-[280px]">
            Secure Institutional Intelligence
        </p>
<!-- Loading Progress -->
<div class="w-full flex flex-col gap-unit items-center">
<div class="h-[2px] w-full bg-surface-border rounded-full overflow-hidden relative max-w-[240px]">
<div class="absolute top-0 left-0 h-full bg-primary animate-progress rounded-full"></div>
</div>
<span class="font-label-md text-label-md text-outline mt-2">Initializing Systems...</span>
</div>
</main>
<script>
        // Simulate loading completion and redirect (for demo purposes)
        setTimeout(() => {
            document.querySelector('.animate-progress').style.animationPlayState = 'paused';
            // In a real app, this would route to the dashboard or login
            console.log("Initialization complete. Redirecting...");
        }, 2500);
    </script>
</body></html>
