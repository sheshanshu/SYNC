<body class="bg-background text-on-surface h-screen w-full flex flex-col font-body-md relative overflow-hidden">
<!-- Mobile Full-Screen Modal Canvas -->
<main class="flex-1 flex flex-col bg-surface-container-lowest z-10 w-full max-w-md mx-auto">
<!-- App Bar / Header -->
<header class="flex items-center justify-between px-padding-card h-16 border-b border-outline-variant bg-surface-container-lowest shrink-0">
<button aria-label="Close modal" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Edit Record</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-padding-card py-margin-page pb-32">
<!-- Error Banner -->
<div class="bg-error-container text-on-error-container p-4 rounded-lg flex items-start gap-3 mb-6 border border-error/20">
<span class="material-symbols-outlined text-error mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<div>
<h3 class="font-body-md font-semibold mb-1">Validation Failed</h3>
<p class="font-body-sm text-on-error-container/80">Missing Required Field: Department_ID</p>
</div>
</div>
<!-- Form -->
<form class="space-y-6">
<!-- Full Name -->
<div class="space-y-1">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Full Name</label>
<input class="w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:border-primary transition-shadow font-body-md text-on-surface" type="text" value="Sarah Jenkins">
</div>
<!-- Email Address -->
<div class="space-y-1">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Email Address</label>
<input class="w-full h-10 px-3 bg-surface-container-lowest border border-outline-variant rounded focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:border-primary transition-shadow font-body-md text-on-surface" type="email" value="s.jenkins@university.edu">
</div>
<!-- Identifier -->
<div class="space-y-1">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Identifier (ID)</label>
<input class="w-full h-10 px-3 bg-surface-container-low border border-outline-variant rounded text-on-surface-variant font-body-md cursor-not-allowed" disabled="" type="text" value="EMP-84729">
</div>
<!-- Role -->
<div class="space-y-1">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider">Role</label>
<div class="relative">
<select class="w-full h-10 pl-3 pr-10 bg-surface-container-lowest border border-outline-variant rounded appearance-none focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:border-primary transition-shadow font-body-md text-on-surface">
<option>Adjunct Professor</option>
<option>Tenured Professor</option>
<option>Staff</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Department (Error State) -->
<div class="space-y-1">
<label class="block font-label-mono text-label-mono text-error uppercase tracking-wider">Department</label>
<div class="relative">
<select class="w-full h-10 pl-3 pr-10 bg-error-container/10 border-2 border-error rounded appearance-none focus:outline-none focus:ring-2 focus:ring-error focus:ring-offset-2 transition-shadow font-body-md text-on-surface">
<option disabled="" selected="" value="">Select Department</option>
<option>Computer Science</option>
<option>Mathematics</option>
<option>Physics</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-error">
<span class="material-symbols-outlined">arrow_drop_down</span>
</div>
</div>
<p class="font-body-sm text-error flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[14px]">warning</span>
                        Department selection is required to complete import.
                    </p>
</div>
</form>
</div>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant p-4 pb-8 sm:pb-4 flex flex-col gap-3 z-20 max-w-md mx-auto right-0">
<button class="w-full h-12 bg-primary text-on-primary rounded font-body-md font-semibold hover:bg-primary-fixed-variant transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">save</span>
                Save &amp; Re-validate
            </button>
<button class="w-full h-12 bg-surface-container-lowest text-on-surface-variant border border-outline-variant rounded font-body-md hover:bg-surface-container-low transition-colors">
                Cancel
            </button>
</div>

</body></html>
