<body class="bg-background text-on-background h-full flex flex-col items-center justify-center font-body-md">
<!-- Connectivity Banner (Server Unavailable) -->
<div class="fixed top-0 left-0 w-full bg-error text-on-error py-unit px-margin-mobile md:px-margin-desktop flex justify-center items-center z-50">
<span class="material-symbols-outlined mr-2 text-[18px]">cloud_off</span>
<span class="font-body-md text-body-md">Server Unavailable.</span>
<a class="ml-4 font-label-md text-label-md underline hover:opacity-80 transition-opacity" href="#">Retry Connection</a>
</div>
<!-- Main Content Container -->
<main class="w-full max-w-[600px] px-margin-mobile flex flex-col items-center text-center">
<!-- Illustration Area (2-tone slate style for empty/error states) -->
<div class="mb-8 relative flex justify-center items-center w-32 h-32 rounded-full bg-surface-container">
<span class="material-symbols-outlined text-[64px] text-surface-tint" style="font-variation-settings: 'FILL' 0;">dns</span>
<!-- Inactive pulse indicator overlay -->
<div class="absolute bottom-2 right-2 w-8 h-8 rounded-full bg-surface-container-highest border-2 border-surface flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-outline">wifi_tethering_off</span>
</div>
</div>
<!-- Typography Hierarchy -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-4">
            System Under Maintenance
        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[400px] mb-8">
            We're currently performing scheduled updates to improve your experience. We'll be back online shortly.
        </p>
<!-- Call to Action -->
<button class="bg-primary text-on-primary font-label-md text-label-md px-6 py-3 rounded-DEFAULT hover:opacity-90 transition-opacity flex items-center shadow-sm">
            Check System Status
            <span class="material-symbols-outlined ml-2 text-[18px]">open_in_new</span>
</button>
<!-- Subtle contextual detail -->
<div class="mt-12 text-outline font-code text-code flex items-center gap-2">
<span>Error 503</span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span>Syncora Mainframe</span>
</div>
