version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syncora-postgres
    restart: always
    environment:
      POSTGRES_USER: syncora_admin
      POSTGRES_PASSWORD: syncora_secure_password
      POSTGRES_DB: syncora_platform_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syncora_admin -d syncora_platform_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: syncora-redis
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: syncora-api
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://syncora_admin:syncora_secure_password@postgres:5432/syncora_platform_db?schema=public
      JWT_SECRET: syncora-secret-key-production-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
