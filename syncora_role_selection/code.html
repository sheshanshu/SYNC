<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Syncora - Role Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#260059",
                        "on-background": "#0b1c30",
                        "surface-container-low": "#eff4ff",
                        "warning": "#F59E0B",
                        "surface": "#f8f9ff",
                        "secondary-fixed": "#ebdcff",
                        "on-primary": "#ffffff",
                        "secondary-container": "#8a54e9",
                        "primary-container": "#091f3f",
                        "error": "#EF4444",
                        "surface-container-high": "#dce9ff",
                        "on-tertiary-fixed": "#002022",
                        "secondary-fixed-dim": "#d3bbff",
                        "error-container": "#ffdad6",
                        "secondary": "#7037ce",
                        "on-primary-fixed-variant": "#344769",
                        "info": "#3B82F6",
                        "tertiary-fixed": "#6ef6ff",
                        "surface-variant": "#d3e4fe",
                        "on-tertiary-container": "#00969d",
                        "on-error-container": "#93000a",
                        "surface-tint": "#4c5f82",
                        "on-secondary-fixed-variant": "#5a16b8",
                        "tertiary": "#00090a",
                        "on-primary-fixed": "#041b3b",
                        "surface-border": "#E2E8F0",
                        "on-error": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "on-secondary-container": "#fffbff",
                        "surface-dim": "#cbdbf5",
                        "background": "#f8f9ff",
                        "inverse-primary": "#b4c7ef",
                        "surface-container": "#e5eeff",
                        "primary-fixed-dim": "#b4c7ef",
                        "tertiary-container": "#002426",
                        "primary-fixed": "#d7e2ff",
                        "outline": "#75777f",
                        "tertiary-fixed-dim": "#4cd9e2",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#000718",
                        "surface-container-highest": "#d3e4fe",
                        "inverse-surface": "#213145",
                        "on-secondary": "#ffffff",
                        "on-surface": "#0b1c30",
                        "success": "#10B981",
                        "on-primary-container": "#7587ad",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#eaf1ff",
                        "on-surface-variant": "#44474e",
                        "outline-variant": "#c5c6cf",
                        "on-tertiary-fixed-variant": "#004f53"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "skeleton-gap": "12px",
                        "unit": "4px",
                        "margin-desktop": "40px",
                        "margin-mobile": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "code": ["JetBrains Mono"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "30px", "fontWeight": "700" }],
                        "code": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .role-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transform: translateY(-2px);
        }
        .role-card:focus-within {
            ring: 2px solid theme('colors.primary');
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- AuthLayout Container -->
<main class="w-full max-w-4xl bg-surface-container-lowest rounded-xl shadow-sm border border-surface-border overflow-hidden grid grid-cols-1 md:grid-cols-2">
<!-- Branding & Illustration Side (Hidden on Mobile) -->
<div class="hidden md:flex flex-col justify-between bg-primary-container p-gutter text-on-primary-container relative overflow-hidden">
<div class="relative z-10">
<div class="font-headline-md text-headline-md font-bold text-on-primary mb-8">Syncora</div>
<h2 class="font-headline-lg text-headline-lg text-on-primary max-w-sm">High-Fidelity Operational Clarity.</h2>
<p class="font-body-lg text-body-lg mt-4 max-w-xs text-inverse-primary">Access the tools tailored for your operational requirements.</p>
</div>
<!-- Abstract background element -->
<div class="absolute bottom-0 right-0 w-64 h-64 bg-secondary rounded-tl-full opacity-20 transform translate-x-12 translate-y-12 blur-3xl"></div>
<div class="absolute top-1/2 left-0 w-48 h-48 bg-info rounded-full opacity-20 transform -translate-x-1/2 -translate-y-1/2 blur-3xl"></div>
</div>
<!-- Role Selection Content Side -->
<div class="p-gutter flex flex-col justify-center bg-surface-container-lowest">
<div class="mb-8">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Select Your Access Role</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Choose your primary dashboard to continue.</p>
</div>
<div class="space-y-4">
<!-- Role Option: Administrator -->
<button class="role-card w-full text-left bg-surface rounded-lg p-4 border border-surface-border flex items-center gap-4 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Administrator</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Syncora Admin Terminal</p>
</div>
<span class="material-symbols-outlined text-outline ml-auto">chevron_right</span>
</button>
<!-- Role Option: Faculty -->
<button class="role-card w-full text-left bg-surface rounded-lg p-4 border border-surface-border flex items-center gap-4 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-container" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Faculty</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Academic &amp; Grading Tools</p>
</div>
<span class="material-symbols-outlined text-outline ml-auto">chevron_right</span>
</button>
<!-- Role Option: Student -->
<button class="role-card w-full text-left bg-surface rounded-lg p-4 border border-surface-border flex items-center gap-4 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
<div class="w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-tertiary-container" style="font-variation-settings: 'FILL' 1;">local_library</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface">Student</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Course &amp; Wellness Portal</p>
</div>
<span class="material-symbols-outlined text-outline ml-auto">chevron_right</span>
</button>
</div>
<div class="mt-8 pt-4 border-t border-surface-border text-center">
<a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors inline-flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[16px]">help</span>
                    Need help accessing your account?
                </a>
</div>
</div>
</main>
<!-- Footer Component Injection Point (Supressed on Linear Flow) -->
<!-- Navigation Shells (Top/Side) are suppressed on this transactional Auth screen -->
</body></html>
